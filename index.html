
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemeX | Reels</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      color: #ff3158;
    }

    .feed {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(100vh - 52px);
      height: calc(100dvh - 52px);
      overflow-x: hidden;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    .reel {
      position: relative;
      width: 100%;
      height: calc(100vh - 52px);
      height: calc(100dvh - 52px);
      min-height: calc(100vh - 52px);
      min-height: calc(100dvh - 52px);
      flex: none;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    .reel video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 480px;
      object-fit: contain;
      background: #000;
    }

    .reel-label {
      position: absolute;
      bottom: 18px;
      left: 15px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }

    @media (min-width: 700px) {
      .reel video {
        max-width: 430px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 MemeX</h1>
  </header>

  <main class="feed" id="feed">

  


    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%208.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG 8</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%207.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG 7</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%206.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG 6</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%205.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG 5</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%204.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG Reel 4</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%203.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG Reel 3</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%202.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG Reel 2</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%201.mp4" type="video/mp4">
      </video>
      <div class="reel-label">IG Reel 1</div>
    </section>

  </main>

  <script>
    const feed = document.getElementById("feed");
    const sections = [...document.querySelectorAll(".reel")];
    const videos = sections.map(section =>
      section.querySelector("video")
    );

    // Pause all reels except the one currently on screen.
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target.querySelector("video");

        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
          videos.forEach(otherVideo => {
            if (otherVideo !== video) {
              otherVideo.pause();
            }
          });
        } else {
          video.pause();
        }
      });
    }, {
      root: feed,
      threshold: [0, 0.6, 1]
    });

    sections.forEach(section => observer.observe(section));
  </script>

</body>
</html>
