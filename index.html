
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MemeX Reels</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      border-bottom: 1px solid #333;
    }

    header h2 {
      margin: 0;
      color: #ff3158;
    }

    .feed {
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
    }

    .reel {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      padding: 60px 10px 20px;
    }

    .reel video {
      display: block;
      height: 100%;
      width: 100%;
      max-width: 480px;
      object-fit: contain;
      background: #000;
    }

    .label {
      position: absolute;
      left: 16px;
      bottom: 24px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
    }

    @media (min-width: 700px) {
      .reel video {
        max-width: 420px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>🔥 MemeX</h2>
  </header>

  <main class="feed">

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="video_20260923_233219.mp4" type="video/mp4">
      </video>
      <div class="label">Reel 1</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="lv_0_20260924003151.mp4" type="video/mp4">
      </video>
      <div class="label">Reel 2</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%208.mp4" type="video/mp4">
      </video>
      <div class="label">IG 8</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%207.mp4" type="video/mp4">
      </video>
      <div class="label">IG 7</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%206.mp4" type="video/mp4">
      </video>
      <div class="label">IG 6</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%205.mp4" type="video/mp4">
      </video>
      <div class="label">IG 5</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%204.mp4" type="video/mp4">
      </video>
      <div class="label">IG Reel 4</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%203.mp4" type="video/mp4">
      </video>
      <div class="label">IG Reel 3</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%202.mp4" type="video/mp4">
      </video>
      <div class="label">IG Reel 2</div>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="ig%20reel%201.mp4" type="video/mp4">
      </video>
      <div class="label">IG Reel 1</div>
    </section>

  </main>

  <script>
    const feed = document.querySelector(".feed");
    const sections = [...document.querySelectorAll(".reel")];
    const videos = sections.map(section =>
      section.querySelector("video")
    );

    // Pause every video except the one currently on screen.
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target.querySelector("video");

        if (!video) return;

        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
          videos.forEach(other => {
            if (other !== video) {
              other.pause();
            }
          });
        } else {
          video.pause();
        }
      });
    }, {
      root: feed,
      threshold: [0, 0.6, 1]
    });

    sections.forEach(section => observer.observe(section));
  </script>

</body>
</html>
